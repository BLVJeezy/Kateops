<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Kitoko Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE8; --surface:#FFFDF9; --surface2:#EFE8DF; --ink:#1F1A16; --ink2:#6B625A; --ink3:#9A9088;
  --line:rgba(31,26,22,.09); --line2:rgba(31,26,22,.16);
  --accent:#B4532A; --accent-soft:#F3DED3; --accent-ink:#fff;
  --sage:#5F7A61; --sage-soft:#E1E8DE; --amber:#B9822A; --amber-soft:#F4E7CF; --rose:#B23B3B; --rose-soft:#F5DCD8;
  --chrome:rgba(250,246,240,.78); --shadow:0 1px 2px rgba(31,26,22,.05),0 8px 24px rgba(31,26,22,.06);
  --r:16px; --hour:76px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --f-display:"Fraunces",Georgia,serif; --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141110; --surface:#1E1A17; --surface2:#28221E; --ink:#F3ECE4; --ink2:#B3A89D; --ink3:#7D736A;
  --line:rgba(243,236,228,.09); --line2:rgba(243,236,228,.17);
  --accent:#D9774B; --accent-soft:#3A2419; --sage:#8FB091; --sage-soft:#1F2A20; --amber:#D9A653; --amber-soft:#33281A; --rose:#E07A72; --rose-soft:#3A1E1C;
  --chrome:rgba(24,20,18,.74); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%;overscroll-behavior-y:contain;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button,a,.chip,[data-a]{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none;min-height:48px;font-size:16px;-webkit-appearance:none;appearance:none}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:84px;resize:vertical}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{min-height:100%}
#main{position:relative;overflow-x:clip}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.view{position:relative;min-height:100vh;min-height:100dvh;padding:0 0 calc(var(--safe-b) + 140px)}
.view.push{background:var(--bg);animation:pushIn .42s cubic-bezier(.2,.9,.25,1)}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
.nav{position:sticky;top:0;z-index:20;height:calc(var(--safe-t) + 54px);padding:var(--safe-t) 10px 0;display:flex;align-items:center;gap:6px;background:transparent;transition:background .2s}
.nav.solid{background:var(--chrome);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);box-shadow:0 1px 0 var(--line)}
.nav .t{flex:1;text-align:center;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.solid .t{opacity:1}
.nav .side{min-width:72px;display:flex;gap:2px;align-items:center}
.nav .side.r{justify-content:flex-end}
.icon-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--line)}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;height:44px;padding:0 6px}
.lt{padding:4px 20px 14px;display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.lt h1{font:500 34px/1.05 var(--f-display);letter-spacing:-.02em;margin:0;font-optical-sizing:auto}
.lt .sub{color:var(--ink2);font-size:14px;margin-top:4px}
.pad{padding:0 16px}
.section-t{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:22px 20px 8px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin:0 16px}
.list>*{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:56px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.cv{content-visibility:auto;contain-intrinsic-size:auto 64px}
html{scroll-padding-top:calc(var(--safe-t) + 120px)}
.more-sentinel{height:60px;display:grid;place-items:center;color:var(--ink3);font-size:13px}
.list>button:active,.list>a:active{background:var(--line)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{color:var(--ink2);font-size:14px;text-align:right;white-space:nowrap}
.chev{color:var(--ink3)}
a{color:var(--accent);text-decoration:none}
.av{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;background:var(--surface2);color:var(--ink2);letter-spacing:.02em}
.av.lg{width:76px;height:76px;border-radius:38px;font:500 28px var(--f-display)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--surface2);color:var(--ink);transition:transform .1s ease-out,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--rose-soft);color:var(--rose)}
.btn.sm{height:38px;padding:0 13px;border-radius:11px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:active{transform:scale(.97)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:500;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.badge.sage{background:var(--sage-soft);color:var(--sage)}.badge.amber{background:var(--amber-soft);color:var(--amber)}.badge.rose{background:var(--rose-soft);color:var(--rose)}.badge.clay{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--ink2);padding:40px 30px}
.empty h3{font:500 22px var(--f-display);color:var(--ink);margin:12px 0 6px}
.field{margin:0 0 14px}
.field>label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.search{position:relative;margin:0 16px 10px}
.search svg{position:absolute;left:13px;top:12px;color:var(--ink3);width:20px;height:20px}
.search input{padding-left:40px;background:var(--surface2);border-color:transparent}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--rose-soft);color:var(--rose);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:500}
.note{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 13px;font-size:13.5px}
.muted{color:var(--ink2)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:14px 0}
.mt{margin-top:14px}.mb{margin-bottom:14px}.flex{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}

.fab{transform:translateZ(0);position:fixed;right:18px;bottom:calc(var(--safe-b) + 18px);z-index:35;width:58px;height:58px;border-radius:29px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(180,83,42,.35);transition:transform .1s ease-out}
.fab:active{transform:scale(.93)}
.fab svg.i{width:26px;height:26px;stroke-width:2.1}
/* home button + launcher */
.homebtn{position:fixed;left:50%;bottom:calc(var(--safe-b) + 16px);z-index:40;width:62px;height:62px;margin-left:-31px;border-radius:31px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:transform .12s ease-out}
.homebtn:active{transform:scale(.92)}
.homebtn svg.i{width:28px;height:28px;stroke-width:1.9}
.launch{position:fixed;inset:0;z-index:90}
.launch-scrim{position:absolute;inset:0;background:rgba(20,15,12,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .25s}
.launch-panel{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 92px);max-width:480px;margin:0 auto;background:var(--surface);border-radius:30px;padding:18px 16px 16px;box-shadow:0 24px 60px rgba(0,0,0,.25);transform-origin:50% calc(100% + 60px);transform:translateY(24px) scale(.86);opacity:0;transition:transform .42s cubic-bezier(.2,.95,.25,1.05),opacity .2s}
.launch.on .launch-scrim{opacity:1}.launch.on .launch-panel{transform:none;opacity:1}
.launch-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.launch-h b{font:500 24px var(--f-display);letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border-radius:20px;font-size:13.5px;font-weight:500;color:var(--ink);opacity:0;transform:translateY(8px)}
.launch.on .tile{opacity:1;transform:none;transition:transform .35s cubic-bezier(.2,.9,.3,1) var(--d),opacity .25s var(--d)}
.tile:active{transform:scale(.94)!important;background:var(--line)}
.simbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 12px;border-radius:18px;background:var(--surface2);text-align:left}
.simbtn .sq{width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}.simbtn.on .sq{background:var(--accent);color:#fff}.simbtn:active{transform:scale(.98)}
.tile .sq{width:66px;height:66px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .sq svg.i{width:32px;height:32px;stroke-width:1.6}
.tile.on .sq{background:var(--accent);color:#fff}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
/* agenda */
.sticky-wk{position:sticky;top:calc(var(--safe-t) + 54px);z-index:15;background:var(--bg);padding-top:4px;box-shadow:0 1px 0 var(--line)}
.slide-l{animation:slideL .32s cubic-bezier(.2,.9,.25,1)}.slide-r{animation:slideR .32s cubic-bezier(.2,.9,.25,1)}
@keyframes slideL{from{transform:translateX(48px);opacity:.2}to{transform:none;opacity:1}}@keyframes slideR{from{transform:translateX(-48px);opacity:.2}to{transform:none;opacity:1}}
.edge-shadow{box-shadow:-10px 0 30px rgba(0,0,0,.14)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 10px 10px;touch-action:pan-y}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;border-radius:14px;color:var(--ink2)}
.wd .n{font:500 19px/1 var(--f-display);color:var(--ink);width:36px;height:36px;border-radius:18px;display:grid;place-items:center}
.wd .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wd .dots{height:5px;display:flex;gap:2px}.wd .dots i{width:5px;height:5px;border-radius:3px;background:var(--accent);opacity:.55}
.wd.today .n{color:var(--accent)}
.wd.sel .n{background:var(--ink);color:var(--bg)}
.wd.closed .n{opacity:.45}
.daybar{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 10px;gap:10px}
.daybar .dt{font:500 20px var(--f-display);letter-spacing:-.01em}
.sumline{color:var(--ink2);font-size:13.5px;padding:0 20px 12px}
.tl-wrap{touch-action:pan-y}
.tl{position:relative;margin:0 12px 0 0;display:flex}
.tl .hours{width:52px;flex:none;position:relative}
.tl .hours div{position:absolute;right:8px;font-size:11.5px;color:var(--ink3);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.tl .cols{flex:1;position:relative;display:flex;gap:4px}
.tl .col{flex:1;position:relative;min-width:0}
.tl .col-h{position:sticky;top:calc(var(--safe-t) + 54px);z-index:5;font-size:12px;font-weight:600;text-align:center;padding:4px 0;background:var(--bg);color:var(--ink2)}
.tl .grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(rgba(127,127,127,.05) 1px,transparent 1px);background-size:100% var(--hour),100% calc(var(--hour)/2)}
.tl .closedz{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.ap{position:absolute;left:2px;right:2px;border-radius:12px;padding:6px 9px;overflow:hidden;text-align:left;background:var(--c,#D9A27E);color:#2A211C;box-shadow:0 1px 2px rgba(0,0,0,.06);border-left:3px solid rgba(0,0,0,.18);transition:transform .1s ease-out;display:block}
.ap:active{transform:scale(.98)}
.ap .tm{font-size:11.5px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
.ap .nm{font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .sv{font-size:12.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .st{position:absolute;right:7px;top:6px;display:flex;gap:3px}
.ap .st svg{width:15px;height:15px}
.ap .rz{position:absolute;left:0;right:0;bottom:-4px;height:20px;touch-action:none;cursor:ns-resize;display:grid;place-items:center;z-index:3}
.ap .rz::after{content:"";width:26px;height:4px;border-radius:2px;background:rgba(0,0,0,.28);opacity:.55}
.ap.resizing{box-shadow:0 8px 22px rgba(0,0,0,.22);z-index:6;transition:none}.ap.resizing .rz::after{opacity:1;width:34px}
.ap.seg2{border-top-left-radius:6px;border-top-right-radius:6px}
.ap.proc{pointer-events:none;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 42%,transparent) 0 6px,color-mix(in srgb,var(--c) 14%,transparent) 6px 12px);color:var(--ink2);border:1.5px dashed color-mix(in srgb,var(--c) 85%,#000 15%);border-left-width:1.5px;box-shadow:none;padding:4px 8px}
.ap.proc .rz{pointer-events:auto}.ap.proc .nm{font-size:12px;font-weight:600}.ap.proc .tm{font-size:11px}
.ap.proc.narrow{padding:0}.ap.proc.narrow .nm,.ap.proc.narrow .tm{display:none}
.rz-tip{position:absolute;right:6px;bottom:14px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;z-index:7;pointer-events:none;font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;gap:6px;flex:none}.stp button{width:36px;height:36px;border-radius:18px;background:var(--surface2);display:grid;place-items:center;font-size:18px;font-weight:600}.stp span{min-width:62px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.plan-proc{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,transparent 6px 12px)}
.ap.blok{background:repeating-linear-gradient(135deg,var(--surface2) 0 8px,var(--bg) 8px 16px);color:var(--ink2);border-left-color:var(--line2)}
.ap.betaald,.ap.voltooid{opacity:.62}
.ap.noshow{background:var(--rose-soft);color:var(--rose)}
.ap.short .sv{display:none}
.now{position:absolute;left:-6px;right:0;height:2px;background:var(--accent);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:5px;background:var(--accent)}
.ghost-slot{position:absolute;left:2px;right:2px;border-radius:12px;border:2px dashed var(--accent);background:var(--accent-soft);opacity:0;pointer-events:none;transition:opacity .15s}

/* sheet */
.sheet-root{position:fixed;inset:0;z-index:100}
.scrim{position:absolute;inset:0;background:rgba(20,15,12,.38);opacity:0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--safe-t) - 28px);background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;will-change:transform;transform:translateY(100%)}
.sheet.tall{height:calc(100% - var(--safe-t) - 28px)}
.grab{height:22px;display:grid;place-items:center;flex:none;touch-action:none;cursor:grab}
.grab span{width:38px;height:5px;border-radius:3px;background:var(--line2)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:0 10px 8px 20px;touch-action:none;flex:none}
.sheet-h h2{flex:1;margin:0;font:500 23px var(--f-display);letter-spacing:-.01em}
.sheet-b{overflow-y:auto;padding:4px 20px calc(var(--safe-b) + 22px);flex:1;overscroll-behavior:contain}
.sheet-f{flex:none;padding:12px 20px calc(var(--safe-b) + 14px);border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px}
.sheet-root.under .sheet{filter:brightness(.92)}
@media (min-width:720px){.sheet{left:50%;width:560px;margin-left:-280px;bottom:auto;top:50%;border-radius:22px;max-height:86vh}.sheet.tall{height:86vh}.grab{display:none}.sheet-h{padding-top:16px}}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:500;z-index:200;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:86vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.syncdot i{width:7px;height:7px;border-radius:4px;background:var(--ink3)}
.syncdot.ok i{background:var(--sage)}.syncdot.local i{background:var(--amber)}.syncdot.err i{background:var(--rose)}
.demo-bar{position:fixed;bottom:calc(var(--safe-b) + 28px);left:14px;white-space:nowrap;padding:6px 6px 6px 12px!important;z-index:45;background:var(--ink);color:var(--bg);border-radius:20px;padding:6px 8px 6px 14px;font-size:13px;font-weight:500;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.demo-bar button{background:var(--accent);color:#fff;border-radius:14px;height:28px;padding:0 10px;font-weight:600;font-size:12.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px}
.kpi .k{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi .v{font:500 26px/1.15 var(--f-display);letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--ink);color:var(--bg)}
.kpi.hero .k,.kpi.hero .d{color:rgba(255,255,255,.62)}

.kpi.hero .v{font-size:40px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;padding:14px 14px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}
.bars .b.zero i{background:var(--line2)}
.bars .b span{font-size:10.5px;color:var(--ink3)}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ticket-line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ticket-line .q{display:flex;align-items:center;gap:4px}
.ticket-line .q button{width:40px;height:40px;border-radius:20px;background:var(--surface2);display:grid;place-items:center}
.ticket-line .q button svg{width:16px;height:16px}
.ticket-line .pr{width:86px;text-align:right;font-weight:600}
.ticket-line .pr input{text-align:right;padding:6px 8px;min-height:36px;font-weight:600}
.pay-m{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay-m button{height:52px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);font-weight:600}
.pay-m button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.totals{background:var(--surface);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
.totals .r{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink2);font-size:14px}
.totals .r.big{color:var(--ink);font:500 24px var(--f-display);padding-top:8px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:9px 13px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line2);text-align:left;font-size:14px;display:flex;flex-direction:column;gap:1px;min-width:46%;flex:1}
.pick button small{color:var(--ink2);font-size:12.5px}
.pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{height:40px;padding:0 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line2);font-weight:500;font-size:14px}
.cc{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin:0 16px 10px}
.cc .f{font:500 19px/1.3 var(--f-display);margin:6px 0}
.photos{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.photos img{width:88px;height:110px;object-fit:cover;border-radius:10px;flex:none}
.hero-fiche{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px 8px}
.hero-fiche h1{font:500 30px/1.1 var(--f-display);letter-spacing:-.02em;margin:12px 0 2px}
.qa{display:flex;gap:10px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.qa a,.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;padding:10px 0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:12px;font-weight:500;color:var(--accent)}
.alpha{margin:16px 20px 6px;font:500 15px var(--f-display);color:var(--accent)}
.onb{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 30px) 22px 40px}
.onb h1{font:500 40px/1.02 var(--f-display);letter-spacing:-.025em;margin:22px 0 10px}
.onb p{color:var(--ink2);margin:0 0 22px}
.mark{width:64px;height:64px}
.cover{height:150px;margin:0 16px 4px;border-radius:var(--r);background:var(--surface2) center/cover;display:flex;align-items:flex-end;padding:14px;color:#fff;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.45))}
.cover span{position:relative;z-index:1;font:500 22px var(--f-display)}
.qr-ov{position:fixed;inset:0;z-index:300;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 20px) 24px calc(var(--safe-b) + 24px);text-align:center;opacity:0;transform:scale(.96);transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.3,1)}
.qr-ov.on{opacity:1;transform:none}
.qr-ov img{width:min(78vw,380px);height:auto;image-rendering:pixelated;border-radius:8px;margin:18px 0}
.qr-ov .amt{font:500 48px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qr-ov .x{position:absolute;top:calc(var(--safe-t) + 10px);right:12px;color:#111}
.qr-ov .tabs{display:flex;gap:8px;margin-top:6px}.qr-ov .tabs button{height:36px;padding:0 14px;border-radius:18px;border:1px solid #ddd;font-weight:500;color:#111}.qr-ov .tabs button.on{background:#111;color:#fff;border-color:#111}
.check-anim{width:76px;height:76px;border-radius:38px;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center;margin:8px auto 10px}
.check-anim svg{width:40px;height:40px;stroke-width:2.4;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (prefers-reduced-transparency:reduce){.launch-scrim,.nav.solid{background:var(--bg);backdrop-filter:none}}
@media (min-width:900px){.view>*{max-width:760px;margin-left:auto;margin-right:auto}.view>.card,.view>.cc{margin-left:auto;margin-right:auto}}

<script>
(()=>{'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+(m||0)};
const toT=m=>pad(Math.floor(m/60))+':'+pad(Math.round(m%60));
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pISO(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>'€ '+r2(n).toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur0=n=>'€ '+Math.round(n||0).toLocaleString('nl-BE');
const DAYS=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const DSH=['zo','ma','di','wo','do','vr','za'];
const MON=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MSH=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const fmtDay=s=>{const d=pISO(s);return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtShort=s=>{const d=pISO(s);return d.getDate()+' '+MSH[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const weekStart=s=>{const d=pISO(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const daysBetween=(a,b)=>Math.round((pISO(b)-pISO(a))/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
const fullName=c=>c?[c.first,c.last].filter(Boolean).join(' '):'';
const initials=c=>((c?.first||'?')[0]+((c?.last||'')[0]||'')).toUpperCase();
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const phoneIntl=p=>{let d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='32'+d.slice(1);else if(d.length===9&&d.startsWith('4'))d='32'+d;return d};
const waLink=(p,txt)=>{const n=phoneIntl(p);return n?'https://wa.me/'+n+'?text='+encodeURIComponent(txt||''):''};
const SVC_COLORS=['#E3B392','#AFC3AB','#D6C59E','#A9BFCB','#D6A7A3','#C2B6A8','#E6C27A','#B9C7A0'];
const STAFF_COLORS=['#B4532A','#5F7A61','#8A6A3B','#5B7487','#9C5B5B'];

/* ---------- icons ---------- */
const P={
cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
users:'<circle cx="9" cy="8.5" r="3.5"/><path d="M2.8 20c.6-3.6 3.2-5.5 6.2-5.5s5.6 1.9 6.2 5.5M15.5 5.3a3.5 3.5 0 0 1 0 6.4M17.5 14.8c2 .7 3.3 2.4 3.7 5.2"/>',
kassa:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
chart:'<path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/>',
more:'<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',phone:'<path d="M6.5 3.5h3l1.5 4-2 1.3a11 11 0 0 0 6.2 6.2l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/>',
chat:'<path d="M4 19.5l1.3-3.9A8 8 0 1 1 8.6 18.6z"/>',drop:'<path d="M12 3.5c3.5 4.2 6 7.6 6 10.6a6 6 0 0 1-12 0c0-3 2.5-6.4 6-10.6z"/>',
gift:'<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5v7.5h14v-7.5M12 8.5V20M12 8.5c-1.5-3.5-5.5-4-5.5-1.5S12 8.5 12 8.5zm0 0c1.5-3.5 5.5-4 5.5-1.5S12 8.5 12 8.5z"/>',
card:'<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/>',box:'<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>',
bell:'<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/><circle cx="12" cy="12" r="7"/>',
scissors:'<circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8.2 8.2L20 18M8.2 15.8L20 6"/>',team:'<circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M2.5 19c.5-3 2.7-4.7 5.5-4.7s5 1.7 5.5 4.7M14 14.6c2.8-.6 6.3.6 7 4.4"/>',
save:'<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4.5 19.5h15"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
alert:'<path d="M12 4l9 15.5H3z"/><path d="M12 10v4M12 17v.5"/>',arrive:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.5l2.3 2.3 4.7-5"/>',
noshow:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',repeat:'<path d="M4 11V9a3 3 0 0 1 3-3h12l-3-3M20 13v2a3 3 0 0 1-3 3H5l3 3"/>',
home:'<path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/>',spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
cake:'<path d="M4 20.5h16M5 20.5v-7h14v7M5 16.5c2 1.3 3.5 1.3 5 0s3.5-1.3 5 0 3 1.3 4 0M12 13.5V10M12 7.5c-1-1-1-2 0-3.5 1 1.5 1 2.5 0 3.5z"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',trash:'<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',camera:'<path d="M4 8.5h3.5L9 6h6l1.5 2.5H20v11H4z"/><circle cx="12" cy="13.5" r="3.5"/>'
};
const ic=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;
const MARK=`<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="var(--ink)"/><path d="M24 15v34" stroke="var(--bg)" stroke-width="5" stroke-linecap="round"/><path d="M42 18c-9 3-14 8-17 14 5-1 11 2 13 8 1.5 4.5 4.5 7.5 9 8" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="16" r="3.2" fill="var(--accent)"/></svg>`;

/* ---------- store ---------- */
const ITEM=['clients','services','products','colorcards','vouchers','punchcards'];
const BUCKET=['appts','sales'];
const emptyData=()=>{const o={settings:null};[...ITEM,...BUCKET].forEach(t=>o[t]={});return o};
const S={mode:'local',data:emptyData(),demo:null,base:null,sync:'local',route:{tab:'agenda',stack:[]},day:today(),staffFilter:'all',repPeriod:'maand',repOffset:0,clientFilter:'alle',q:''};
const D=()=>S.demo||S.data;
const all=t=>Object.values(D()[t]||{});
const get=(t,id)=>id?D()[t][id]:null;
const ST=()=>D().settings||defaultSettings();
const monthOf=o=>(o.date||today()).slice(0,7);
const CACHE='kitoko-cache-v1';
function cacheLocal(){try{const c=clone(S.data);Object.values(c.colorcards).forEach(x=>{if(x.photos&&x.photos.length)x.photos=[]});if(c.settings)delete c.settings.cover;localStorage.setItem(CACHE,JSON.stringify(c))}catch(e){}}
function loadLocal(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c&&typeof c==='object'){const e=emptyData();for(const k in e)if(c[k]!=null)e[k]=c[k];S.data=e}}catch(e){}}
const Q={};
function queueWrite(key,fn){const q=Q[key]||(Q[key]={busy:false,next:null});q.next=fn;if(!q.busy)runQ(key)}
async function runQ(key){const q=Q[key];q.busy=true;while(q.next){const fn=q.next;q.next=null;let tries=0;for(;;){try{await fn();setSync('ok');break}catch(e){tries++;const code=e&&e.code;if(code==='unavailable'&&tries<2){await new Promise(r=>setTimeout(r,600+Math.random()*900));continue}console.warn('write',key,e);if(code==='quota_exceeded')toast('Opslag is vol: verwijder oude gegevens of maak een backup.');else if(code==='invalid_argument'&&String(e.message||'').includes('256'))toast('Te groot om op te slaan (foto te zwaar?)');setSync('err');break}}}q.busy=false}
function writeBucket(t,m){queueWrite('b/'+t+'/'+m,()=>{const items={};for(const o of Object.values(S.data[t]))if(monthOf(o)===m)items[o.id]=o;const ref=S.base.collection(t).doc(m);return Object.keys(items).length?ref.set({items:clone(items)}):ref.delete()})}
function save(t,o){const d=D();const prev=d[t][o.id];d[t][o.id]=o;if(!QUIET)o.updatedAt=Date.now();else if(!o.updatedAt)o.updatedAt=Date.now()-5000;render();if(S.demo)return;cacheLocal();if(t==='appts'&&!QUIET)scheduleSync();if(S.mode!=='cloud')return;
  if(BUCKET.includes(t)){const m=monthOf(o);writeBucket(t,m);if(prev&&monthOf(prev)!==m)writeBucket(t,monthOf(prev))}
  else queueWrite('c/'+t+'/'+o.id,()=>S.base.collection(t).doc(o.id).set(clone(o)))}
function remove(t,id){const d=D();const prev=d[t][id];if(!prev)return;delete d[t][id];render();if(S.demo)return;if(t==='appts'&&!QUIET&&prev.extId&&prev.extSource!=='ics'&&ST().gcal&&ST().gcal.on){const s=clone(ST());s.gcal.pendingDel=[...(s.gcal.pendingDel||[]),prev.extId];QUIET=true;saveSettings(s);QUIET=false;scheduleSync()}cacheLocal();if(S.mode!=='cloud')return;
  if(BUCKET.includes(t))writeBucket(t,monthOf(prev));else queueWrite('c/'+t+'/'+id,()=>S.base.collection(t).doc(id).delete())}
function saveSettings(s){const d=D();d.settings=s;render();if(S.demo)return;cacheLocal();if(S.mode==='cloud')queueWrite('settings',()=>S.base.set({settings:clone(s)}))}
async function uploadAll(){if(!S.base)return;await S.base.set({settings:clone(S.data.settings)});for(const t of ITEM)for(const o of Object.values(S.data[t]))await S.base.collection(t).doc(o.id).set(clone(o));for(const t of BUCKET){const ms=new Set(Object.values(S.data[t]).map(monthOf));for(const m of ms){const items={};Object.values(S.data[t]).forEach(o=>{if(monthOf(o)===m)items[o.id]=o});await S.base.collection(t).doc(m).set({items:clone(items)})}}}
function setSync(s){if(S.sync===s)return;S.sync=s;const el=$('#syncdot');if(el){el.className='syncdot '+s;el.lastChild.textContent=syncLabel()}}
const syncLabel=()=>({ok:'Gesynchroniseerd',local:'Alleen op dit toestel',err:'Opslaan mislukt',slow:'Verbinden…'})[S.sync]||'';
async function connect(){
  let tries=0;while(!(window.claude&&window.claude.use)&&tries<30){await new Promise(r=>setTimeout(r,100));tries++}
  if(!(window.claude&&window.claude.use)){setSync('local');return}
  let db=null,user=null;try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  if(!db||!user){setSync('local');return}
  let id=null;try{id=await user.id()}catch(e){}
  if(!id){setSync('local');return}
  let base;try{base=db.doc('data/users/'+id+'/salon')}catch(e){setSync('local');return}
  S.base=base;S.mode='cloud';setSync('slow');
  try{const first=await base.get();if(!first.exists&&S.data.settings){await uploadAll();toast('Je gegevens staan nu veilig online')}}catch(e){console.warn(e)}
  const timer=setTimeout(()=>{if(S.sync==='slow')setSync('slow')},10000);
  base.onSnapshot(sn=>{if(!sn.metadata.fromCache){clearTimeout(timer);if(S.sync!=='err')setSync('ok')}if(sn.exists){const s=sn.data().settings;if(s)S.data.settings=clone(s)}cacheLocal();render()},e=>{clearTimeout(timer);setSync('err')});
  for(const t of ITEM)base.collection(t).onSnapshot(qs=>{if(qs.metadata.fromCache&&qs.empty)return;const m={};qs.docs.forEach(d=>{m[d.id]=clone(d.data())});S.data[t]=m;cacheLocal();render()},e=>console.warn(t,e));
  for(const t of BUCKET)base.collection(t).onSnapshot(qs=>{if(qs.metadata.fromCache&&qs.empty)return;const m={};qs.docs.forEach(d=>{const it=d.data().items||{};for(const k in it)m[k]=clone(it[k])});S.data[t]=m;cacheLocal();render()},e=>console.warn(t,e));
}

/* ---------- defaults ---------- */
function defaultSettings(){return{salon:'Kitoko by Kate',owner:'Kate',vat:21,slot:15,onboarded:false,
  hours:{1:['09:00','18:00'],2:['09:00','18:00'],3:['09:00','18:00'],4:['09:00','20:00'],5:['09:00','18:00'],6:['08:30','15:00'],0:null},
  team:[{id:'me',name:'Kate',color:STAFF_COLORS[0]}],

function bindEdgeBack(v){let st=null;const W=()=>v.offsetWidth;const apply=x=>{v.style.transform=`translateX(${Math.max(0,x)}px)`};

function dayRange(date){let mn=24*60,mx=0;for(const k in ST().hours){const h=ST().hours[k];if(h){mn=Math.min(mn,toMin(h[0]));mx=Math.max(mx,toMin(h[1]))}}if(mn>=mx){mn=540;mx=1080}activeAppts(date).forEach(a=>{mn=Math.min(mn,toMin(a.start));mx=Math.max(mx,toMin(a.start)+a.dur)});return[Math.floor(mn/60)*60,Math.ceil(mx/60)*60]}
function viewAgenda(){const st=ST();const ws=weekStart(S.day);const team=st.team||[];
  const week=Array.from({length:7},(_,i)=>{const d=addDays(ws,i);const n=activeAppts(d).filter(a=>a.type!=='blok').length;return`<button class="wd${d===S.day?' sel':''}${d===today()?' today':''}${openHours(d)?'':' closed'}" data-a="pickDay" data-d="${d}"><span class="l">${DSH[pISO(d).getDay()]}</span><span class="n">${pISO(d).getDate()}</span><span class="dots">${'<i></i>'.repeat(Math.min(n,4))}</span></button>`}).join('');
  const appts=activeAppts(S.day).filter(a=>S.staffFilter==='all'||(a.staffId||'me')===S.staffFilter);const real=appts.filter(a=>a.type!=='blok');
  const expected=real.filter(a=>a.status!=='noshow').reduce((x,a)=>x+svcPrice(a.serviceIds),0);const oh=openHours(S.day);
  let gap='';if(oh){const free=findFree(S.day,45,S.staffFilter==='all'?'me':S.staffFilter,1)[0];if(free&&free.date===S.day)gap=` · eerste vrije plek ${free.start}`}
  const m=pISO(S.day);const title=MON[m.getMonth()][0].toUpperCase()+MON[m.getMonth()].slice(1);
  const staffChips=team.length>1?`<div class="chips" style="margin-bottom:10px"><button class="chip${S.staffFilter==='all'?' on':''}" data-a="staff" data-k="all">Iedereen</button>${team.map(t=>`<button class="chip${S.staffFilter===t.id?' on':''}" data-a="staff" data-k="${t.id}"><i style="width:8px;height:8px;border-radius:4px;background:${t.color}"></i>${esc(t.name)}</button>`).join('')}</div>`:'';
  return nav({title:fmtDay(S.day),right:`<button class="btn ghost sm" data-a="today">Vandaag</button>`})+
  `<div class="lt"><div><h1>${title}</h1><div class="sub">${esc(st.salon)}</div></div><div class="flex"><button class="icon-btn" data-a="week" data-k="-1" aria-label="Vorige week">${ic('left')}</button><button class="icon-btn" data-a="week" data-k="1" aria-label="Volgende week">${ic('right')}</button></div></div>
  <div class="sticky-wk"><div class="week" id="weekStrip">${week}</div>${staffChips}
  <div class="daybar"><div class="dt">${fmtDay(S.day)[0].toUpperCase()+fmtDay(S.day).slice(1)}</div>${oh?`<span class="badge">${toT(oh[0])}–${toT(oh[1])}</span>`:'<span class="badge rose">Gesloten</span>'}</div>
  </div><div class="sumline" style="padding-top:10px">${real.length?`${real.length} afspra${real.length===1?'ak':'ken'} · ${eur0(expected)} verwacht${gap}`:(oh?'Nog niets gepland. Tik op een uur om een afspraak te maken.':'Je salon is gesloten op deze dag.')}</div>
  <div class="tl-wrap" id="tlWrap">${timeline(appts)}</div>`}
let RS=null,suppressClick=0;
function layoutAppt(a,segs,s){const H=76;const out=[];let t=toMin(a.start);segs.forEach((g,i)=>{out.push({k:'s',i,top:(t-s)/60*H,h:Math.max(g.dur/60*H-2,20),t0:t,t1:t+g.dur});t+=g.dur;if(g.proc>0){out.push({k:'p',i,top:(t-s)/60*H,h:Math.max(g.proc/60*H-2,14),t0:t,t1:t+g.proc});t+=g.proc}});return out}
function timeline(appts){const[s,e]=dayRange(S.day);const H=76;const hours=[];for(let t=s;t<=e;t+=60)hours.push(`<div style="top:${(t-s)/60*H}px">${toT(t)}</div>`);const height=(e-s)/60*H;const team=ST().team||[];
  const cols=(S.staffFilter==='all'&&team.length>1)?team.map(t=>t.id):[S.staffFilter==='all'?'me':S.staffFilter];const oh=openHours(S.day);
  const colHtml=cols.map(cid=>{const list=appts.filter(a=>(a.staffId||'me')===cid||(cols.length===1&&S.staffFilter==='all')).sort((a,b)=>toMin(a.start)-toMin(b.start));
    const ov=(A,B)=>A.some(([x,y])=>B.some(([p,q])=>x<q&&p<y));const busy={};list.forEach(a=>busy[a.id]=busyOf(a));

    const blocks=list.map(a=>{const n=nOf[a.id],w=100/n,l=laneOf[a.id];const c=get('clients',a.clientId);const isBlok=a.type==='blok';const segs=isBlok?[{sid:null,dur:a.dur,proc:0}]:segsOf(a);const end=toMin(a.start)+segsTotal(segs);
      const flags=(c&&c.warn?ic('alert'):'')+(a.status==='aangekomen'?ic('arrive'):a.status==='betaald'?ic('check'):a.status==='noshow'?ic('noshow'):'')+(a.repeat?ic('repeat'):'');
      return layoutAppt(a,segs,s).map(B=>{const g=segs[B.i];const sv=get('services',g.sid);const col=isBlok?'':(sv?.color||apptColor(a));
        if(B.k==='p'){const others=list.some(o=>o.id!==a.id&&busy[o.id].some(([x,y])=>x<B.t1&&B.t0<y));const pw=others?w*0.3:w;
          return`<div class="ap proc ${others?'narrow':''}" data-id="${a.id}" data-k="p" data-i="${B.i}" style="top:${B.top}px;height:${B.h}px;left:calc(${l*w}% + 2px);right:auto;width:calc(${pw}% - 4px);--c:${col}"><div class="nm">Inwerktijd</div><div class="tm">${B.t1-B.t0} min</div>${a.status!=='betaald'?`<i class="rz" data-rz="p|${B.i}" aria-label="Inwerktijd aanpassen"></i>`:''}</div>`}
        const procOverlap=list.some(o=>o.id!==a.id&&layoutAppt(o,o.type==='blok'?[{sid:null,dur:o.dur,proc:0}]:segsOf(o),s).some(P=>P.k==='p'&&P.t0<B.t1&&B.t0<P.t1)&&laneOf[o.id]===l);const off=procOverlap?w*0.3:0;
        const first=B.i===0;return`<button class="ap ${isBlok?'blok':''} ${a.status} ${B.h<46?'short':''} ${first?'':'seg2'}" style="top:${B.top}px;height:${B.h}px;left:calc(${l*w+off}% + 2px);right:auto;width:calc(${w-off}% - 4px);--c:${col}" data-a="openAppt" data-id="${a.id}" data-k="s" data-i="${B.i}">${first?`<div class="tm">${a.start}–${toT(end)}</div><div class="nm">${esc(apptName(a))}</div><div class="sv">${esc(isBlok?'':(sv?sv.name:''))}</div><span class="st">${flags}</span>`:`<div class="nm" style="font-size:13px">${esc(sv?sv.name:'')}</div><div class="sv">${esc(apptName(a))}</div>`}${a.status!=='betaald'&&!(isBlok&&false)?`<i class="rz" data-rz="s|${B.i}" aria-label="Duur aanpassen"></i>`:''}</button>`}).join('')}).join('');
    const closed=oh?`${oh[0]>s?`<div class="closedz" style="top:0;height:${(oh[0]-s)/60*H}px"></div>`:''}${oh[1]<e?`<div class="closedz" style="top:${(oh[1]-s)/60*H}px;bottom:0"></div>`:''}`:`<div class="closedz" style="inset:0"></div>`;
    const tn=team.find(t=>t.id===cid);return`<div class="col" data-col="${cid}" style="height:${height}px">${cols.length>1?`<div class="col-h" style="position:absolute;top:-24px;left:0;right:0">${esc(tn?.name||'')}</div>`:''}<div class="grid"></div>${closed}<div class="ghost-slot" id="ghost-${cid}"></div>${blocks}</div>`}).join('');
  const nowL=S.day===today()&&nowMin()>=s&&nowMin()<=e?`<div class="now" style="top:${(nowMin()-s)/60*H}px"></div>`:'';
  return`<div class="tl" style="${cols.length>1?'margin-top:24px':''}"><div class="hours" style="height:${height}px">${hours.join('')}</div><div class="cols" id="tlCols" data-s="${s}" style="height:${height}px">${nowL}${colHtml}</div></div><div style="height:40px"></div>`}
function bindResize(cols){const s=+cols.dataset.s;cols.addEventListener('pointerdown',e=>{const h=e.target.closest('.rz');if(!h)return;e.preventDefault();e.stopPropagation();const blk=h.closest('.ap');const a=get('appts',blk.dataset.id);if(!a)return;
  const isBlok=a.type==='blok';const segs=isBlok?[{sid:null,dur:a.dur,proc:0}]:segsOf(a);const[kind,ix]=h.dataset.rz.split('|');const i=+ix;const orig=kind==='s'?segs[i].dur:segs[i].proc;const y0=e.clientY;const step=5;let last=orig;
  try{h.setPointerCapture(e.pointerId)}catch(_){}RS={id:a.id};blk.classList.add('resizing');const tip=document.createElement('div');tip.className='rz-tip';blk.appendChild(tip);
  const els=$$(`.ap[data-id="${a.id}"]`,cols);const relayout=()=>{const L=layoutAppt(a,segs,s);els.forEach(el=>{const B=L.find(x=>x.k===el.dataset.k&&x.i===+el.dataset.i);if(!B){el.style.display='none';return}el.style.display='';el.style.top=B.top+'px';el.style.height=B.h+'px'});const tm=$('.tm',els.find(x=>x.dataset.k==='s'&&x.dataset.i==='0'));if(tm)tm.textContent=a.start+'–'+toT(toMin(a.start)+segsTotal(segs))};

  const mv=ev=>{const d=Math.round((ev.clientY-y0)/76*60/step)*step;const nv=Math.max(kind==='s'?5:0,orig+d);if(nv===last)return;last=nv;if(kind==='s')segs[i].dur=nv;else segs[i].proc=nv;haptic(3);relayout();setTip()};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);RS=null;suppressClick=Date.now();blk.classList.remove('resizing');tip.remove();
    if(last===orig){render(true);return}const total=segsTotal(segs);

function checkout({apptId,clientId,saleId,clientName,lines}={}){const st=ST();let T;
  if(saleId){T=clone(get('sales',saleId))}else{const a=apptId?get('appts',apptId):null;const cid=a?a.clientId:clientId;T={id:uid(),date:today(),time:toT(nowMin()),clientId:cid||null,clientName:a?a.clientName:(clientName||''),apptId:apptId||null,lines:(a?a.serviceIds:[]).map(i=>{const s=get('services',i);return s?{kind:'dienst',refId:s.id,name:s.name,qty:1,price:+s.price,staffId:a.staffId||'me'}:null}).filter(Boolean),discount:0,discType:'eur',status:'open',payments:[]};if(lines)T.lines.push(...lines)}
  T.useCredit=T.useCredit||0;T.voucher=T.voucher||null;T.punch=T.punch||null;let method='Bancontact',split=false,cashIn='';
  const sub=()=>T.lines.reduce((a,l)=>a+l.qty*l.price,0);const disc=()=>T.discType==='pct'?sub()*(+T.discount||0)/100:(+T.discount||0);
  const punchVal=()=>{if(!T.punch)return 0;const l=T.lines.find(l=>l.kind==='dienst'&&l.refId===T.punch.serviceId);return l?l.price:0};
  const total=()=>r2(Math.max(0,sub()-disc()));const due=()=>r2(Math.max(0,total()-punchVal()-(T.useCredit||0)-(T.voucher?T.voucher.amount:0)));

  else if(S.repPeriod==='maand'){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);a=iso(d);const e=new Date(d.getFullYear(),d.getMonth()+1,0);b=iso(e);label=MON[d.getMonth()]+' '+d.getFullYear();for(let x=a;x<=b;x=addDays(x,1))days.push(x)}
  else{const y=new Date().getFullYear()+o;a=y+'-01-01';b=y+'-12-31';label=String(y)}
  return{a,b,label,days}}

    // push app → Google
    let budget=40;for(const a of all('appts')){if(budget<=0)break;if(a.date<from||a.date>to||a.status==='geannuleerd'||a.extSource==='ics'||a.extSource==='gcal'&&!a.extId)continue;const s=toMin(a.start);const body={summary:evTitle(a),description:evDesc(a),startTime:evTime(a.date,s),endTime:evTime(a.date,s+a.dur)};
      if(!a.extId){budget--;const r=await mcp.callTool(GCAL,'create_event',{calendarId:cal,...body,notificationLevel:'NONE',...(a.type==='blok'?{}:{})},{cache:false});const p=r.payload||{};const id=p.id||(p.event&&p.event.id);if(id){const cur=get('appts',a.id);if(cur)quietSave('appts',{...cur,extId:id,extSource:'kitoko',extUpdated:p.updated||null,syncedAt:Date.now()+3000});pushed++}}
      else if((a.updatedAt||0)>(a.syncedAt||0)+2000){budget--;const r=await mcp.callTool(GCAL,'update_event',{calendarId:cal,eventId:a.extId,...body,notificationLevel:'NONE'},{cache:false});const cur=get('appts',a.id);if(cur)quietSave('appts',{...cur,extUpdated:(r.payload&&r.payload.updated)||cur.extUpdated,syncedAt:Date.now()+3000});pushed++}}
    const g=clone(ST().gcal);for(const id of (g.pendingDel||[]).slice()){try{await mcp.callTool(GCAL,'delete_event',{calendarId:cal,eventId:id,notificationLevel:'NONE'},{cache:false})}catch(e){if(e&&e.code!=='tool_error')throw e}g.pendingDel=g.pendingDel.filter(x=>x!==id)}
    g.last=Date.now();QUIET=true;saveSettings({...ST(),gcal:g});QUIET=false;GS.msg=[added&&added+' nieuw',changed&&changed+' gewijzigd',pushed&&pushed+' naar Google',removed&&removed+' verwijderd'].filter(Boolean).join(', ');if(manual)toast(GS.msg?'Gesynchroniseerd: '+GS.msg:'Alles is up-to-date');Object.keys(nameCache).forEach(k=>delete nameCache[k])}
  catch(e){console.warn('gcal',e);GS.err=mcpMsg(e);if(manual)toast(GS.err);if(e&&e.retryable&&!manual)setTimeout(()=>gcalSync(),Math.max(3000,e.retryAfterMs||8000))}
  finally{GS.busy=false;gsRender()}}
async function gcalLink(){const mcp=await getMcp();if(!mcp){toast(mcpMsg({code:'not_granted'}));return}let cals=[];
  try{const r=await mcp.callTool(GCAL,'list_calendars',{pageSize:100},{cache:false});cals=((r.payload||{}).calendars||(r.payload||{}).items||[]).filter(c=>!/holiday|#contacts|#weeknum/.test(c.id))}catch(e){toast(mcpMsg(e));return}
  const opt={cal:'primary',calName:'Hoofdagenda',mode:'clients',createClients:true,pastDays:30};
  openSheet({title:'Google Agenda koppelen',tall:true,body:(b,api)=>{const draw=()=>{b.innerHTML=`<p class="muted small">Afspraken uit je Google Agenda komen in de app, en wat je in de app inplant verschijnt in je Google Agenda. Wijzig je iets aan één kant, dan volgt de andere.</p>
    <div class="section-t" style="margin-left:0">Welke agenda?</div><div class="card" style="margin:0"><div class="list"><button data-c="primary" data-n="Hoofdagenda"><div class="row-main"><div class="row-t">Hoofdagenda</div><div class="row-s">Je standaard Google Agenda</div></div>${opt.cal==='primary'?ic('check'):''}</button>${cals.map(c=>`<button data-c="${esc(c.id)}" data-n="${esc(c.summary)}"><div class="row-main"><div class="row-t">${esc(c.summary)}</div><div class="row-s">${esc(c.description||'')}</div></div>${opt.cal===c.id?ic('check'):''}</button>`).join('')}</div></div>
    <div class="section-t" style="margin-left:0">Wat staat er in deze agenda?</div><div class="seg"><button class="${opt.mode==='clients'?'on':''}" data-m="clients">Enkel klanten</button><button class="${opt.mode==='mixed'?'on':''}" data-m="mixed">Ook privé</button></div><p class="small muted">${opt.mode==='clients'?'Elk item wordt een klantafspraak.':'Items zonder herkende klant of dienst worden een blok, zo boek je daar niemand.'}</p>
    <label class="flex mb"><input type="checkbox" data-o="createClients" ${opt.createClients?'checked':''} style="width:22px;min-height:22px;accent-color:var(--accent)"><span>Maak klantprofielen aan uit de namen in de titels</span></label>
    <div class="note">Tip: oudere afspraken (geschiedenis) haal je binnen via een export (.ics) op het vorige scherm. De koppeling houdt de laatste 30 dagen en de komende 4 maanden gelijk.</div>`};draw();
    b.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){opt.cal=c.dataset.c;opt.calName=c.dataset.n;draw()}const m=e.target.closest('[data-m]');if(m){opt.mode=m.dataset.m;draw()}const o=e.target.closest('[data-o]');if(o){opt[o.dataset.o]=o.checked}})},
  footer:(ft,api)=>{ft.innerHTML=`<button class="btn block" data-n>Annuleren</button><button class="btn p block" data-y>Koppelen</button>`;$('[data-n]',ft).onclick=()=>api.close();$('[data-y]',ft).onclick=()=>{saveSettings({...ST(),gcal:{on:true,cal:opt.cal,calName:opt.calName,mode:opt.mode,createClients:opt.createClients,pastDays:opt.pastDays,pendingDel:[],last:null}});api.close();gcalSync({manual:true})}}})}
function viewCalSync(){const g=ST().gcal||{};const n=all('appts').filter(a=>a.extSource==='gcal'||a.extSource==='ics').length;return`<p class="pad small muted">Werk je nu met een gewone agenda? Haal alles binnen en houd beide gelijk.</p>
  <div class="section-t">Google Agenda · live</div><div class="card" style="padding:16px"><div class="flex"><span class="av" style="background:var(--accent-soft);color:var(--accent)">${ic('repeat')}</span><div class="row-main"><div class="row-t">Twee kanten op synchroniseren</div><div class="row-s" id="gsStatus" style="white-space:normal">${gsLine()}</div></div></div>
  ${g.on?`<div class="grid2 mt"><button class="btn p" data-a="gsNow">${ic('repeat')} Nu synchroniseren</button><button class="btn" data-a="gsLink">${ic('gear')} Instellingen</button></div><button class="btn ghost block mt" data-a="gsOff">Ontkoppelen</button>`:`<button class="btn p block mt" data-a="gsLink">Koppel Google Agenda</button><p class="small muted" style="margin:10px 0 0">Werkt via je Claude-account: voeg eenmalig "Google Calendar" toe bij claude.ai → Instellingen → Connectors.</p>`}</div>
  <div class="section-t">Importeren uit een bestand (.ics)</div><div class="card" style="padding:16px"><p class="small muted" style="margin-top:0">Werkt met elke agenda: Google, Apple (iCloud), Outlook. Ideaal om je volledige geschiedenis binnen te halen.</p>
  <details class="small muted mb"><summary style="color:var(--accent);font-weight:500;cursor:pointer">Hoe exporteer ik mijn agenda?</summary><p><b>Google:</b> op computer, calendar.google.com → tandwiel → Instellingen → Importeren en exporteren → Exporteren. Pak het zip-bestand uit.</p><p><b>Apple / iPhone:</b> op een Mac, app Agenda → Archief → Exporteer → Exporteer. Of op iCloud.com de agenda openbaar delen en de link openen.</p><p><b>Outlook:</b> Agenda → Delen → Publiceren → ICS-link, of Bestand → Opslaan als .ics.</p></details>
  <button class="btn block" data-a="icsImport">${ic('save')} Kies .ics bestand</button>${n?`<p class="small muted" style="margin:10px 0 0">${n} afspraken komen uit je oude agenda.</p>`:''}</div>
  <div class="section-t">Naar je agenda-app</div><div class="card" style="padding:16px"><p class="small muted" style="margin-top:0">Geen Google? Exporteer je afspraken als .ics en open het bestand op je iPhone of Mac om ze in Apple Agenda te zetten.</p><button class="btn block" data-a="icsExport">${ic('cal')} Exporteer afspraken (.ics)</button></div>`}

/* ---------- import/export ---------- */
function exportJSON(){const d=clone(S.demo?S.demo:S.data);copyText(JSON.stringify({app:'kitoko',v:1,exported:new Date().toISOString(),data:d}))}
function exportCSV(){const{a,b}=period();const rows=[['datum','uur','klant','omschrijving','totaal','btw','betaalmethode']];salesIn(a,b).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)).forEach(s=>{const c=get('clients',s.clientId);rows.push([s.date,s.time,c?fullName(c):(s.clientName||''),s.lines.map(l=>l.qty+'x '+l.name).join(' | '),r2(s.total).toFixed(2).replace('.',','),r2(s.total-s.total/(1+(ST().vat||21)/100)).toFixed(2).replace('.',','),s.payments.map(p=>p.method+' '+r2(p.amount).toFixed(2).replace('.',',')).join(' + ')])});copyText(rows.map(r=>r.map(v=>/[;"\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(';')).join('\n'))}
function importFile(){const inp=$('#jsonIn');inp.value='';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const txt=String(r.result);if(f.name.toLowerCase().endsWith('.csv')||!txt.trim().startsWith('{'))return importCSV(txt);
  try{const j=JSON.parse(txt);const d=j.data||j;if(!d.settings&&!d.clients)throw 0;confirmSheet('Backup terugzetten?','Bestaande gegevens met dezelfde id worden overschreven. Andere gegevens blijven staan.','Terugzetten',false,()=>{if(d.settings)saveSettings({...defaultSettings(),...d.settings,onboarded:true});[...ITEM,...BUCKET].forEach(t=>Object.values(d[t]||{}).forEach(o=>save(t,o)));toast('Backup teruggezet')})}catch(e){toast('Dit bestand kan ik niet lezen')}};r.readAsText(f)};inp.click()}
function importCSV(txt){const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2){toast('Leeg bestand');return}const sep=lines[0].includes(';')?';':',';const head=lines[0].split(sep).map(h=>norm(h.replace(/"/g,'')));
  const idx=keys=>head.findIndex(h=>keys.some(k=>h.includes(k)));const iF=idx(['voornaam','first']),iL=idx(['familienaam','achternaam','last','naam']),iP=idx(['gsm','mobile','telefoon','phone']),iE=idx(['mail']),iC=idx(['gemeente','city','stad']);
  const rows=lines.slice(1).map(l=>l.split(sep).map(v=>v.replace(/^"|"$/g,'').trim()));confirmSheet('Klanten importeren?',`${rows.length} klanten gevonden.`,'Importeren',false,()=>{let n=0;rows.forEach(r=>{const o={id:uid(),first:iF>=0?r[iF]:'',last:iL>=0&&iL!==iF?r[iL]:'',phone:iP>=0?r[iP]:'',email:iE>=0?r[iE]:'',city:iC>=0?r[iC]:'',tags:[],credit:0,createdAt:Date.now()};if(o.first||o.last){save('clients',o);n++}});toast(n+' klanten geïmporteerd')})}

/* ---------- views + events ---------- */
function viewTab(t){return({agenda:viewAgenda,klanten:viewKlanten,kassa:viewKassa,rapporten:viewRapporten,meer:viewMeer}[t]||viewAgenda)()}
document.addEventListener('click',e=>{if(Date.now()-suppressClick<450){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;lastScroll=0;const a=el.dataset.a,id=el.dataset.id,k=el.dataset.k;
  switch(a){
  case'launcher':openLauncher();break;
  case'tab':if(S.route.tab===k&&!S.route.stack.length){window.scrollTo({top:0,behavior:'smooth'})}else go(k);break;
  case'back':back();break;case'today':S.day=today();render();break;case'pickDay':S.day=el.dataset.d;render();break;case'week':S.day=addDays(S.day,7*k);render();break;case'staff':S.staffFilter=k;render();break;
  case'newAppt':apptSheet({date:S.day,start:S.day===today()?toT(Math.ceil(nowMin()/15)*15):(openHours(S.day)?toT(openHours(S.day)[0]):'10:00')});break;
  case'openAppt':apptDetail(id);break;case'client':S.clientTab='overzicht';if(S.route.tab!=='klanten'&&!S.route.stack.length){S.route.tab='klanten'}push('client',id);break;
  case'newClient':clientSheet();break;case'editClient':clientSheet(get('clients',id));break;case'ctab':S.clientTab=k;render();break;case'cfilter':S.clientFilter=k;S.clientLimit=150;scrollMem['klanten/']=0;render(true);break;
  case'bookClient':apptSheet({clientId:id,date:S.day>=today()?S.day:today(),start:'10:00'});break;case'payClient':checkout({clientId:id});break;
  case'newCard':cardSheet(id);break;case'editCard':{const c=get('colorcards',id);cardSheet(c.clientId,c);break}
  case'addCredit':amountSheet('Voorschot toevoegen','Bedrag (wordt tegoed van de klant)',v=>{const c=get('clients',id);save('clients',{...c,credit:r2((+c.credit||0)+v)});save('sales',{id:uid(),date:today(),time:toT(nowMin()),clientId:id,lines:[{kind:'tegoed',name:'Voorschot',qty:1,price:v}],payments:[{method:'Bancontact',amount:v}],total:v,status:'paid'});toast('Voorschot geregistreerd')});break;
  case'newTicket':pickClient(cid=>checkout({clientId:cid}));break;case'oneoffTicket':checkout({});break;case'openTicket':checkout({saleId:id});break;case'payAppt':checkout({apptId:id});break;
  case'receipt':{const s=get('sales',id);if(s)receiptSheet(s);break}
  case'rep':S.repOffset=Math.min(0,S.repOffset+ +k);render();break;case'repP':S.repPeriod=k;S.repOffset=0;render();break;case'exportCSV':exportCSV();break;
  case'pg-services':push('services');break;case'pg-products':push('products');break;case'pg-vouchers':push('vouchers');break;case'pg-punch':push('punch');break;case'pg-marketing':push('marketing');break;case'pg-settings':push('settings');break;case'pg-team':push('team');break;case'pg-backup':push('backup');break;case'pg-calsync':push('calsync');break;case'gsNow':gcalSync({manual:true});break;case'gsLink':gcalLink();break;case'icsImport':pickICS();break;case'icsExport':exportICS();break;
  case'gsOff':confirmSheet('Google Agenda ontkoppelen?','Afspraken blijven in de app en in Google staan, ze worden alleen niet meer gelijk gehouden.','Ontkoppelen',true,()=>{saveSettings({...ST(),gcal:{...ST().gcal,on:false}});GS.err=null});break;
  case'editSvc':svcSheet(get('services',id));break;case'defaultSvcs':loadDefaultServices();break;case'editProd':prodSheet(get('products',id));break;
  case'stock':{const p=get('products',id);save('products',{...p,stock:(+p.stock||0)+ +k});break}
  case'sellVoucher':amountSheet('Cadeaubon verkopen','Bedrag van de bon',v=>checkout({lines:[{kind:'cadeaubon',name:'Cadeaubon '+eur(v),qty:1,price:v}]}));break;
  case'editStaff':staffSheet((ST().team||[]).find(t=>t.id===id));break;
  case'cover':pickImage(d=>saveSettings({...ST(),cover:d}));break;case'rmCover':{const s=clone(ST());delete s.cover;saveSettings(s);break}
  case'exportJSON':exportJSON();break;
  case'qrAdd':pickImage(d=>{const s=clone(ST());s.qrs=[...(s.qrs||[]),{id:uid(),name:(s.qrs||[]).length?'QR '+((s.qrs||[]).length+1):'Payconiq',img:d}];saveSettings(s);toast('QR-code bewaard')},{max:640,png:true});break;
  case'qrDel':confirmSheet('QR-code verwijderen?','','Verwijderen',true,()=>{const s=clone(ST());s.qrs.splice(+k,1);saveSettings(s)});break;
  case'qrShowSet':showQR(null,{index:+k});break;
  case'qrQuick':if(!(ST().qrs||[]).length){toast('Voeg eerst je QR-code toe');push('settings')}else amountSheet('Betaal-QR','Bedrag (optioneel)',v=>showQR(v),'',true);break;case'importFile':importFile();break;
  case'finishOnb':{const s=defaultSettings();s.salon=$('#ob-salon').value.trim()||s.salon;s.owner=$('#ob-owner').value.trim()||s.owner;s.team[0].name=s.owner;s.onboarded=true;const svc=$('#ob-svc').checked;S.demo=null;saveSettings(s);if(svc&&!all('services').length)loadDefaultServices();go('agenda');toast('Welkom, '+s.owner+'!');break}
  case'startDemo':S.demo=makeDemo();go('agenda');break;case'stopDemo':S.demo=null;go('agenda');break;
  }});
// klanten search & settings inputs
let qT;document.addEventListener('input',e=>{if(e.target.id==='cq'){S.q=e.target.value;S.clientLimit=150;clearTimeout(qT);qT=setTimeout(()=>render(true),120)}});
document.addEventListener('change',e=>{const t=e.target;const st=ST();
  if(t.dataset.set){const s=clone(st);s[t.dataset.set]=t.dataset.num!=null?(+t.value||0):t.value;saveSettings(s)}
  if(t.dataset.qrn!=null){const s=clone(st);s.qrs[+t.dataset.qrn].name=t.value.trim()||'QR';saveSettings(s)}
  if(t.dataset.day!=null){const s=clone(st);s.hours[t.dataset.day]=t.checked?['09:00','18:00']:null;saveSettings(s)}
  if(t.dataset.h!=null){const s=clone(st);const h=s.hours[t.dataset.h]||['09:00','18:00'];h[+t.dataset.i]=t.value;s.hours[t.dataset.h]=h;saveSettings(s)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==S.route.tab)go(h)});
setInterval(()=>{if(S.route.tab==='agenda'&&!S.route.stack.length&&!sheets.length&&S.day===today())render()},60000);

/* ---------- boot ---------- */
loadLocal();const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.route.tab=h;if(h==='demo'||h==='test'){S.demo=makeDemo();S.route.tab='agenda'}doRender();connect().then(()=>setTimeout(()=>gcalSync(),1500));setInterval(()=>{if(document.visibilityState==='visible')gcalSync()},5*60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const g=ST().gcal;if(g&&g.on&&Date.now()-(g.last||0)>60000)gcalSync()}});
})();
</script>
